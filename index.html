<script>
  try {
    var _t = localStorage.getItem('dh_theme');
    if (_t === 'dark' || (!_t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  } catch(e){}

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  
  :root {
    --bg: #f5f6fb; --text: #101828; --card-bg: #ffffff; 
    --primary: #3b82f6; --primary-hover: #2563eb;
    --border: #e5e7eb; --text-mut: #6b7280;
  }
  html.dark {
    --bg: #0a101f; --text: #e8ecf8; --card-bg: #121a33;
    --border: rgba(255,255,255,0.1); --text-mut: #8b96b8;
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 20px; padding-top: env(safe-area-inset-top, 20px);
    transition: background 0.3s, color 0.3s;
  }

  /* Avatar & Header */
  .profile-header { display: flex; flex-direction: column; align-items: center; margin-top: 30px; text-align: center; }
  .avatar-wrap { position: relative; width: 100px; height: 100px; margin-bottom: 15px; }
  .avatar-wrap img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #6a5cff; box-shadow: 0 0 20px rgba(106,92,255,0.3); }
  .verify-badge { position: absolute; bottom: 0; right: 0; width: 24px; height: 24px; background: #0d8bf2; border-radius: 50%; border: 2px solid var(--bg); display: flex; justify-content: center; align-items: center; }
  .verify-badge svg { width: 14px; height: 14px; fill: #fff; }
  
  .greeting { font-size: 14px; color: var(--text-mut); margin-bottom: 5px; }
  .name { font-size: 24px; font-weight: 900; margin-bottom: 5px; letter-spacing: -0.5px; }
  .bio { font-size: 14px; color: var(--text-mut); margin-bottom: 20px; }

  /* Social Buttons */
  .socials { display: flex; gap: 10px; margin-bottom: 25px; }
  .social-btn { display: flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 12px; background: var(--card-bg); border: 1px solid var(--border); color: var(--text); text-decoration: none; font-size: 14px; font-weight: 700; transition: transform 0.2s; }
  .social-btn:hover { transform: scale(1.05); }

  /* Main Cards Container */
  .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; }

  /* Stats Box */
  .stats-box { background: var(--card-bg); border-radius: 20px; padding: 20px; border: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  .stat-item h3 { font-size: 20px; color: #3b82f6; margin-bottom: 5px; }
  .stat-item p { font-size: 12px; color: var(--text-mut); font-weight: 600; }
  .stat-badge { grid-column: 1 / -1; display: flex; justify-content: center; align-items: center; gap: 5px; font-size: 14px; font-weight: 800; color: #6a5cff; }

  /* Contact Card */
  .contact-card { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 18px 20px; border-radius: 20px; border: 1px solid var(--border); text-decoration: none; color: var(--text); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  .contact-card h4 { font-size: 15px; font-weight: 800; }
  .contact-card p { font-size: 13px; color: var(--text-mut); margin-top: 3px; }
  .contact-card svg { width: 20px; height: 20px; color: var(--text-mut); }

  /* Floating Buttons (Music & Guide) */
  .fab-container { position: fixed; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 50; }
  .fab { width: 45px; height: 45px; border-radius: 50%; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; color: #fff; }
  .fab svg { width: 20px; height: 20px; }
</style>
